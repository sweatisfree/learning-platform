<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1d12"/>
      <stop offset="0.42" stop-color="#7a5330"/>
      <stop offset="0.78" stop-color="#c08b4d"/>
      <stop offset="1" stop-color="#e0b477"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.74" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#ffe0ad" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffe0ad" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3118" stop-opacity="0"/>
      <stop offset="1" stop-color="#241708" stop-opacity="0.85"/>
