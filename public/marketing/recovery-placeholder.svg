<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1018"/>
      <stop offset="0.55" stop-color="#1b2440"/>
      <stop offset="1" stop-color="#33406b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.65" cy="0.7" r="0.55">
      <stop offset="0" stop-color="#9fb4ff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#9fb4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="32"/></filter>
  </defs>
  <rect width="1200" height="1000" fill="url(#base)"/>
  <rect width="1200" height="1000" fill="url(#glow)"/>
  <g filter="url(#soft)" opacity="0.45">
    <ellipse cx="860" cy="700" rx="330" ry="240" fill="#2c3862"/>
    <ellipse cx="260" cy="200" rx="300" ry="220" fill="#090c14"/>
  </g>
  <rect width="1200" height="1000" filter="url(#grain)" opacity="0.5"/>
</svg>
