<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101821"/>
      <stop offset="0.55" stop-color="#1d3038"/>
      <stop offset="1" stop-color="#31504f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#8fe3cc" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8fe3cc" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1200" height="1000" fill="url(#base)"/>
  <rect width="1200" height="1000" fill="url(#glow)"/>
  <g filter="url(#soft)" opacity="0.45">
    <ellipse cx="880" cy="300" rx="300" ry="240" fill="#2f5c57"/>
    <ellipse cx="240" cy="820" rx="360" ry="260" fill="#0d141b"/>
  </g>
  <rect width="1200" height="1000" filter="url(#grain)" opacity="0.5"/>
</svg>
