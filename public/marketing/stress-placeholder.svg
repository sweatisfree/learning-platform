<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1512"/>
      <stop offset="0.5" stop-color="#3a2c23"/>
      <stop offset="1" stop-color="#6b5140"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#e8c9a3" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#e8c9a3" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1200" height="1000" fill="url(#base)"/>
  <rect width="1200" height="1000" fill="url(#glow)"/>
  <g filter="url(#soft)" opacity="0.4">
    <ellipse cx="300" cy="240" rx="320" ry="230" fill="#7a5c45"/>
    <ellipse cx="960" cy="820" rx="340" ry="250" fill="#150f0b"/>
  </g>
  <rect width="1200" height="1000" filter="url(#grain)" opacity="0.5"/>
</svg>
