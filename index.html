<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Platform</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
    }
    .card {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 480px;
    }
    h1 {
      font-size: 2.25rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.5;
      color: #cbd5e1;
      margin-bottom: 2rem;
    }
    button {
      font-size: 1rem;
      font-weight: 600;
      padding: 0.75rem 1.75rem;
      border: none;
      border-radius: 8px;
      background: #6366f1;
      color: white;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #4f46e5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to the Sweat Is Free Learning Platform</h1>
    <p>Your journey to mastering new skills starts here. Explore courses, track your progress, and learn at your own pace.</p>
    <button type="button" onclick="location.href='#get-started'">Get Started</button>
  </div>
</body>
</html>
