<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Platform</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
    }
    .card {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 480px;
    }
    h1 {
      font-size: 2.25rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.5;
      color: #cbd5e1;
      margin-bottom: 2rem;
    }
    button {
      font-size: 1rem;
      font-weight: 600;
      padding: 0.75rem 1.75rem;
      border: none;
      border-radius: 8px;
      background: #6366f1;
      color: white;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #4f46e5;
    }
    input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      font-size: 1rem;
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.75rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
    }
    .auth-buttons {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
    }
    .auth-buttons button {
      flex: 1;
    }
    #signup-btn {
      background: transparent;
      border: 1px solid #6366f1;
    }
    #signup-btn:hover {
      background: #1e293b;
    }
    #auth-message {
      min-height: 1.2rem;
      font-size: 0.9rem;
      margin-top: 0.75rem;
      margin-bottom: 0;
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to the Sweat Is Free Learning Platform</h1>
    <p>Your journey to mastering new skills starts here. Explore courses, track your progress, and learn at your own pace.</p>

    <div id="auth-section">
      <form id="auth-form">
        <input type="email" id="email" placeholder="Email" autocomplete="email" required>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
        <div class="auth-buttons">
          <button type="submit" id="login-btn">Log In</button>
          <button type="button" id="signup-btn">Sign Up</button>
        </div>
      </form>
      <p id="auth-message"></p>
    </div>

    <div id="app-section" style="display:none;">
      <p id="welcome-message"></p>
      <button type="button" id="logout-btn">Log Out</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(
      'https://sagdpvndrbwwiraiynuv.supabase.co',
      'sb_publishable_sEWZ-W9Yv6culOKhwIABhQ_-iLoWzhM'
    );

    const authSection = document.getElementById('auth-section');
    const appSection = document.getElementById('app-section');
    const authForm = document.getElementById('auth-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const authMessage = document.getElementById('auth-message');
    const signupBtn = document.getElementById('signup-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const welcomeMessage = document.getElementById('welcome-message');

    function setAuthMessage(text, isError = true) {
      authMessage.textContent = text;
      authMessage.style.color = isError ? '#f87171' : '#4ade80';
    }

    function showLoggedIn(session) {
      authSection.style.display = 'none';
      appSection.style.display = 'block';
      welcomeMessage.textContent = `Welcome back, ${session.user.email}!`;
    }

    function showLoggedOut() {
      authSection.style.display = 'block';
      appSection.style.display = 'none';
    }

    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        showLoggedIn(session);
      } else {
        showLoggedOut();
      }
    });

    supabase.auth.onAuthStateChange((_event, session) => {
      if (session) {
        showLoggedIn(session);
      } else {
        showLoggedOut();
      }
    });

    authForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      setAuthMessage('');

      const { error } = await supabase.auth.signInWithPassword({
        email: emailInput.value,
        password: passwordInput.value,
      });

      if (error) {
        setAuthMessage(error.message);
      }
    });

    signupBtn.addEventListener('click', async () => {
      setAuthMessage('');

      const { data, error } = await supabase.auth.signUp({
        email: emailInput.value,
        password: passwordInput.value,
      });

      if (error) {
        setAuthMessage(error.message);
        return;
      }

      if (!data.session) {
        setAuthMessage('Check your email to confirm your account.', false);
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await supabase.auth.signOut();
    });
  </script>
</body>
</html>
